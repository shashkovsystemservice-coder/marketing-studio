nt-size:16px}.foot{flex-wrap:wrap}}
.mobile-nav{display:none}.maphero{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center;margin:22px 0}.mapcore{aspect-ratio:1;border-radius:50%;background:#173e48;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;box-shadow:0 0 0 8px #e1ecee}.mapcore strong{font-size:16px}.mapcore small{color:#c5e0e3;font-size:11px}.mapgroups{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mapgroup{background:white;border:1px solid #dce5e7;border-radius:9px;padding:12px}.mapgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#526b74}.mapgroup details{border-top:1px solid #e5ebed;margin:0;padding:8px 0}.mapgroup summary{font-size:13px;list-style:none;display:flex;align-items:center;gap:7px}.mapgroup summary:after{content:'+';margin-left:auto}.mapid{font-size:10px;color:#52747b;background:#edf4f4;padding:2px 5px;border-radius:4px}.mapgroup p{font-size:12px;margin:8px 0}@media(max-width:700px){aside{position:sticky;top:0;z-index:9;padding:4px 6px;background:white}.mobile-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}.mobile-nav button{border:0;padding:6px 2px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:#526b74}.mobile-nav button span{font-size:20px;line-height:1}.mobile-nav button.active{background:#e1eeee;color:#17575b}.maphero{grid-template-columns:1fr;gap:18px}.mapcore{width:108px;justify-self:center;font-size:25px}.mapcore strong{font-size:13px}.mapgroups{gap:8px}.mapgroup{padding:9px}.mapgroup summary{font-size:12px;overflow-wrap:anywhere}}.evidenceflow .node{border-left:2px solid #8fb6b8;padding:12px 14px;margin:12px 0;background:#f5f9f9}.node strong,.node small{display:block}.node strong{margin-top:5px}.node p{margin:6px 0}.node button{padding:5px 9px}.mobile-nav button span{font-family:system-ui}@media(max-width:700px){.mobile-nav{grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}.mobile-nav button{font-size:9px;min-width:0;padding:7px 0}.mobile-nav button span{font-size:17px}aside{position:static}}.workspace-intro textarea{display:block;margin:8px 0 12px;resize:vertical;background:white}.workspace-intro button{margin:4px 5px 4px 0}.workspace-intro label{font-weight:600}.tabs button:focus-visible,button:focus-visible{outline:2px solid #21676b;outline-offset:2px}.mapid{white-space:nowrap;flex-shrink:0}.tabs button.active{background:#e3efef;border-color:#21676b}.finding-summary{font-size:18px;font-weight:650;color:#173e48}.result-actions{display:flex;flex-wrap:wrap;gap:8px}</style><header><strong>Marketing Studio</strong><span class="muted">Industrial Service · Demo</span></header><div class="layout"><aside><small>WORKSPACE</small><nav id="nav"></nav><div id="mobileNav" class="mobile-nav"></div><p><small>Interactive rule-based prototype<br>Synthetic evidence · No live AI</small></p></aside><main id="main"></main></div><script type="module">
import{sample,evaluate,affected}from './engine.mjs';
const names=['Overview','Work','Company knowledge','Results','Decisions','Marketing Map','Management'];const labels={own:'Our offer',a:'Competitor A',b:'Competitor B'},keys={price:'Annual price (€)',response:'Response (hours)',visits:'Planned visits'};let page=0,tab='Summary';let s;try{s=JSON.parse(localStorage.getItem('ms-workspace-v2'))}catch{}s=s||{data:structuredClone(sample),results:evaluate(structuredClone(sample)).map(r=>({...r,evidence:Object.fromEntries(r.deps.map(p=>{const [a,k]=p.split('.');return [p,sample[a][k]]}))})),stale:[],history:['Illustrative comparison calculated from sample inputs.'],linked:false,conflicts:{}};s.conflicts||={};s.versions||=[];if(!s.results&&!s.history.length){s.results=evaluate(s.data);s.history.push('Illustrative comparison calculated from sample inputs.')}const save=()=>localStorage.setItem('ms-workspace-v2',JSON.stringify(s));const el=document.querySelector('#main');const esc=x=>String(x??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const go=i=>{page=i;tab='Summary';render();window.scrollTo(0,0)};const btn=(t,i)=>'<button data-go="'+i+'">'+t+'</button>';const title=(a,b)=>'<small>'+a+'</small><h1>'+b+'</h1>';function run(){const d=structuredClone(s.data);for(const p of Object.keys(s.conflicts)){const [a,k]=p.split('.');d[a][k]=null}const fresh=evaluate(d).map(r=>({...r,evidence:Object.fromEntries(r.deps.map(p=>{const [a,k]=p.split('.');return [p,d[a][k]]})),calculatedAt:new Date().toISOString()}));s.versions||=[];if(s.results)s.versions.push(structuredClone(s.results));s.results=s.results?s.results.map(old=>s.stale.includes(old.id)?fresh.find(x=>x.id===old.id):old):fresh;s.stale=s.stale.filter(x=>x==='H01');s.history.push('Comparison calculated; unresolved conflicts excluded.');save();go(3)}
function change(a,k,v){const p=a+'.'+k;if(s.data[a][k]===v)return;const previous=s.data[a][k];s.data[a][k]=v;s.stale=[...new Set([...s.stale,...affected(p)])];s.history.push(labels[a]+' · '+keys[k]+' changed: '+String(previous??'Unknown')+' → '+String(v??'Unknown'));save();render()}
function inputs(){return '<div class="grid">'+Object.entries(s.data).map(([a,o])=>'<section><h3>'+labels[a]+'</h3><small>Source: fictional offer '+a.toUpperCase()+'</small>'+Object.entries(keys).map(([k,n])=>'<label>'+n+'<input type="number" min="0" data-field="'+a+'.'+k+'" value="'+esc(o[k]??'')+'"></label>').join('')+'<details><summary>Source and scope</summary>Sample annual industrial maintenance offer. Values are declared, not independently verified. Contract equivalence assumed for the sample; geography, tax and response definition unverified.</details></section>').join('')+'</div><section><h3>Conflicting evidence</h3><p>Test a second fictional source reporting competitor B annual price of €5,100. Do not average conflicting observations.</p><button id="conflict">'+(s.conflicts['b.price']?'Resolve conflict: retain original sample source':'Add conflicting source')+'</button>'+(s.conflicts['b.price']?'<p class="warn">B price: '+esc(s.data.b.price)+' vs 5100. Unresolved.</p>':'')+'</section>'}
function method(){return '<section><h2>Method and limits</h2><p>Compare declared offer attributes under common conditions. Missing values are not zero. Different visit volumes limit price comparison. A difference does not establish customer value.</p><p>Inputs: offer observations, scope and definitions. Output: comparative findings, limitations and evidence gaps. Executor: deterministic calculation and rules. No autonomous research.</p><p>Other alternatives: in-house service, substitutes and no action — not researched.</p></section>'}
function results(){if(!s.results)return '<section><h2>No saved result yet</h2>'+btn('Open comparison',1)+'</section>';return '<section><h2>Comparative findings</h2>'+s.results.map(r=>{const other=labels[r.other||'b'];const label=r.key==='price'?'Annual price':'Declared response time';const delta=r.delta;return '<div class="line"><strong>'+label+' · '+other+'</strong><p>'+(s.stale.includes(r.id)?'<span class="tag">Review required · previous finding</span> ':'')+(delta===null?'Insufficient comparable evidence.':delta===0?'No nominal difference.':'Our offer is '+(r.key==='price'?(delta<0?'cheaper':'more expensive'):(delta<0?'faster to respond':'slower to respond'))+' by '+Math.abs(delta)+(r.key==='price'?' EUR':' hours')+'.')+'</p><small>'+(r.status==='conditional'?'Conditional: service volumes or scope differ.':r.status==='insufficient'?'Missing or conflicting observation.':'Sample scope assumed; other terms unverified.')+'</small><details><summary>Grounds</summary>'+(r.evidence?Object.entries(r.evidence).map(([p,v])=>esc(p)+': '+esc(v)).join(' · '):r.deps.map(esc).join(' · ')+' · Historical values not captured')+'<p>Fictional offer cards; see Company knowledge.</p>'+btn('Open sources',2)+'</details></div>'}).join('')+'</section><section><h2>Current offer observations</h2><table><thead><tr><th>Attribute</th><th>Our offer</th><th>A</th><th>B</th></tr></thead><tbody>'+Object.entries(keys).map(([k,n])=>'<tr><th>'+n+'</th>'+['own','a','b'].map(a=>'<td>'+esc(s.data[a][k])+(s.conflicts[a+'.'+k]?' · conflict':'')+'</td>').join('')+'</tr>').join('')+'</tbody></table><p><small>Current inputs; saved findings above may require review.</small></p>'+btn('Change observations',2)+'</section><section><h2>Use this result</h2><p>Your comparison is saved. You can finish here, or investigate whether response time matters to buyers.</p><div class="result-actions"><button data-go="0">Finish and return to workspace</button><button id="link">Use findings in offer assessment</button><button id="export">Export saved findings</button></div></section>'}
function reviewHypothesis(){if(!s.linked||s.stale.includes('C02'))return;const finding=s.results?.find(x=>x.id==='C02');if(!finding||finding.delta==null)return;s.hypothesisReview={finding:structuredClone(finding),status:'Unverified — buyer evidence missing'};s.stale=s.stale.filter(x=>x!=='H01');s.history.push('H01 reviewed against updated comparison; buyer value remains unverified.');save();render()}
const routeCatalogue=[["acquisition","How can we find new customers?","Identify target customers; assess value and channels; design acquisition tests","Prioritized acquisition plan","AI + MASTER; research; human choice"],["decline","Why are sales declining?","Clarify period and scope; decompose sales; compare explanations; identify missing evidence","Diagnostic findings and next checks","AI + MASTER; calculations; research"],["competition","How does our offer compare with competitors?","Review comparable offers; calculate differences; check limitations","Comparative offer matrix","Current: deterministic calculation; target: AI research + MASTER"],["demand","Is there demand for our product?","Define market; gather demand evidence; test assumptions","Demand validation plan","AI research + MASTER"],["retention","Why are customers leaving?","Define cohorts; examine retention and customer evidence; test explanations","Retention diagnosis","AI + analytics + MASTER"],["budget","How should we allocate our marketing budget?","Review approved plan; estimate costs; compare resource constraints","Draft marketing budget","MASTER + calculations + human approval"]];
let selectedRoute=null;
function routeCards(){return '<section><h2>Explore business questions</h2>'+routeCatalogue.map(r=>'<button style="display:block;width:100%;text-align:left;margin:6px 0" id="rq-'+r[0]+'">'+r[1]+'</button>').join('')+'</section>'}
const routeSteps={"acquisition":[["Understand business context","AI + existing knowledge","Offer, geography, existing customers","Reuse current profiles if applicable"],["Identify potential customers","MASTER + research","Segment profiles","If evidence is missing, research buyers"],["Evaluate channels and value","AI research + MASTER","Opportunity shortlist","Check fit and resource constraints"],["Design acquisition tests","AI synthesis + human review","Prioritized test plan","Do not promise acquisition outcomes"]],"decline":[["Define the decline","AI + MASTER","Period, product, segment","Check comparable periods"],["Decompose sales","Calculations","Volume, price, conversion","If data missing, request it"],["Compare explanations","AI research + MASTER","Competing hypotheses","Investigate competitors only if relevant"],["Select next checks","Human + MASTER","Diagnostic plan","Do not infer causality from correlation"]],"demand":[["Define market and offer","AI + MASTER","Scope and assumptions","Clarify buyer and geography"],["Gather demand evidence","AI research","Sources and buyer signals","Distinguish interest from purchase"],["Assess evidence","MASTER + analysis","Demand hypotheses","If weak, design validation"],["Plan validation","Human + AI","Test plan","No unsupported market estimate"]],"retention":[["Define customer cohorts","AI + MASTER","Cohort and time window","Check data coverage"],["Measure retention","Calculations","Retention patterns","Separate churn definitions"],["Investigate explanations","AI research","Customer evidence","Do not infer motives from metrics"],["Choose next tests","MASTER + human","Retention diagnosis","Validate before intervention"]],"budget":[["Review approved plan","MASTER","Initiatives and objectives","If absent, clarify plan first"],["Estimate resource costs","Calculations + evidence","Costed activities","Unknown cost is not zero"],["Compare constraints","MASTER + analysis","Budget alternatives","Check capacity and affordability"],["Prepare approval","Human","Draft budget","No automatic approval"]]};
function routePreview(r){return title('PROPOSED WORK / TARGET ROUTE',r[1])+'<p class="muted">Illustrative workflow · AI execution not integrated</p><section><h2>Expected result</h2><p>'+r[3]+'</p><h2>Professional route</h2><div class="evidenceflow">'+routeSteps[r[0]].map((a,i)=>'<div class="node"><small>0'+(i+1)+' · '+a[1]+'</small><strong>'+a[0]+'</strong><p>Output: '+a[2]+'</p><small>Condition: '+a[3]+'</small></div>').join('')+'</div><details><summary>How AI and MASTER work together</summary><p>AI interprets and researches; MASTER governs applicable methods and evidence requirements; software performs calculations; humans retain decision authority. Existing knowledge is reused only when relevant and current.</p></details>'+ (r[0]==='decline'?'<button id="rq-competition">Explore comparison as a possible investigation</button><p class="muted">Not evidence that competition caused the decline.</p>':'')+btn('Back to workspace',0)+'</section>'}
function render(){document.querySelector('#nav').innerHTML=names.map((n,i)=>'<button data-go="'+i+'" class="'+(i===page?'active':'')+'">'+n+'</button>').join('');document.querySelector('#mobileNav').innerHTML=names.map((n,i)=>'<button data-go="'+i+'" class="'+(i===page?'active':'')+'"><span aria-hidden="true">'+['⌂','▤','◫','▥','◇','◎','▦'][i]+'</span>'+['Home','Work','Knowledge','Results','Decisions','Map','Manage'][i]+'</button>').join('');let h='';
if(page===0)h=title('WORKSPACE / INDUSTRIAL SERVICE','Marketing workspace')+'<p>Get a professional marketing result for a business question, without having to choose the method yourself.</p><div class="workspace-intro"><div class="eyebrow">START NEW WORK</div><h2>What would you like to achieve?</h2><label for="need">Describe your business question</label><textarea id="need" rows="2" placeholder="How does our service offer compare with competitors?">'+esc(s.need||'')+'</textarea><button class="primary" id="route">Find a suitable task →</button><p id="routeNote" aria-live="polite"><small>Target: AI-assisted professional work. Current demo: limited rule-based routing.</small></p></div>'+routeCards()+'<section><div class="eyebrow">OTHER ENTRY POINT</div><h2>Marketing self-assessment</h2><p>Understand your current practices and priorities.</p><small>Separate prototype · not integrated</small></section><section><div class="eyebrow">YOUR WORKSPACE</div><h2>Current work</h2><div class="workrow"><div><strong>Competitive offer comparison</strong><p class="muted">'+(s.results?'Saved result · '+(s.stale.length?'Review needed':'Available'):'Sample task · Ready to start')+'</p></div>'+btn(s.results?'View result':'Open',s.results?3:1)+'</div><div class="workrow"><div><strong>Company knowledge</strong><p class="muted">3 offer entities · Sample sources</p></div>'+btn('Explore',2)+'</div></section><details><summary>About this demonstration</summary><p>Synthetic evidence, deterministic calculations, local browser storage. Free-form AI routing is not available.</p></details>';
if(page===1&&selectedRoute&&selectedRoute[0]!=='competition')h=routePreview(selectedRoute);else if(page===1&&!s.taskConfirmed)h=title('PROPOSED WORK','Compare service offers')+'<section><h2>Your business question</h2><p>'+esc(s.need||'How competitive is our maintenance offer?')+'</p><h3>What this work will deliver</h3><p>A comparison of annual price, response time and planned visits, with limitations and missing evidence. It will not establish buyer preference or recommend a final positioning decision.</p><h3>Scope and inputs</h3><p>Three fictional annual industrial maintenance offers. Review the declared values before calculation.</p><details><summary>How this work is performed</summary><p>Current: deterministic comparison. Target: AI-assisted evidence collection and interpretation within MASTER; human decision authority. No live AI in this demo.</p></details><button class="primary" id="confirmTask">Start comparison</button>'+btn('Back to workspace',0)+'</section>';else if(page===1)h=title('WORK / COMPETITIVE RESEARCH','Compare service offers')+'<p>Goal: establish comparable differences and evidence gaps, not approve a new offer.</p><section><span class="tag">'+(s.results?'Result saved':'Ready for input review')+'</span><h2>Review inputs</h2><p>Check declared annual prices, response times and visits. Blank means unknown.</p>'+inputs()+'<button class="primary" id="run">Run comparison</button></section>'+method();
if(page===2)h=title('COMPANY KNOWLEDGE','Offers and observations')+'<p>Persistent sample entities, sources and editable observations. Changes are recorded.</p>'+inputs()+'<section><h2>Change history</h2>'+s.history.map(x=>'<p>'+esc(x)+'</p>').join('')+'</section>';
if(page===3)h=title('RESULTS / COMPETITIVE RESEARCH','How does our offer compare?')+'<p>Calculated comparison · synthetic data</p><div class="tabs">'+['Summary','Method','History'].map(t=>'<button class="'+(tab===t?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('')+'</div>'+(tab==='Method'?method():tab==='History'?'<section>'+s.history.map(x=>'<p>'+esc(x)+'</p>').join('')+'</section>':results())+(s.stale.some(x=>x!=='H01')?'<button id="run">Review changed findings</button>':'');
if(page===4)h=title('DECISIONS / OFFER ASSESSMENT','Is response speed valuable to buyers?')+'<p>Decision preparation · not an approved positioning decision</p><section class="evidenceflow"><div class="eyebrow">EVIDENCE CHAIN</div><div class="node"><small>01 · Source observations</small><strong>Declared service response</strong><p>Our offer: '+esc(s.data.own.response)+' h · Competitor B: '+esc(s.data.b.response)+' h</p>'+btn('Inspect sources',2)+'</div><div class="node"><small>02 · Comparative finding</small><strong>'+(!s.linked?'Not linked':s.stale.includes('C02')?'Review required':s.results?.find(x=>x.id==='C02')?.delta==null?'Insufficient evidence':'Nominal difference: '+Math.abs(s.results.find(x=>x.id==='C02').delta)+' h')+'</strong><p>Declared difference is not evidence of buyer preference.</p>'+btn('Inspect result',3)+'</div><div class="node"><small>03 · Customer value hypothesis</small><strong>Response speed may influence buyer choice</strong><p class="tag">'+(s.stale.includes('H01')?'Review required':s.hypothesisReview?'Reviewed · unverified':'Unverified')+'</p>'+ (s.linked&&s.stale.includes('H01')&&!s.stale.includes('C02')&&s.results?.find(x=>x.id==='C02')?.delta!=null?'<button id="reviewH">Review updated grounds</button>':'')+(s.hypothesisReview?'<p><small>Last reviewed difference: '+esc(s.hypothesisReview.finding.delta)+' h (our response minus competitor). Buyer evidence still missing.</small></p>':'')+'</div></section><section><h2>Evidence required before a decision</h2>'+['Buyer priorities and willingness to pay','Operational capacity and SLA feasibility','Cost and commercial viability'].map(x=>'<div class="workrow"><span>'+x+'</span><small>Missing</small></div>').join('')+'<p class="warn">Decision not ready for approval.</p></section>';
