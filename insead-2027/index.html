<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Studio — Workspace</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui;color:#20343d;background:#f5f7f8}header{padding:16px 24px;background:white;border-bottom:1px solid #dce3e5;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:20px;letter-spacing:-.7px}small,.muted{color:#596b74}aside{padding:22px 14px;background:#eaf0f1}nav{display:grid;gap:5px}button{font:inherit;cursor:pointer;border:1px solid #b9c9cd;border-radius:7px;background:white;color:#20343d;padding:9px 14px}button.primary,nav button.active{background:#205b61;color:white;border-color:#205b61}nav button{text-align:left;border-color:transparent;background:transparent}main{padding:28px;min-width:0;max-width:1100px} .layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 70px)}section{background:white;border:1px solid #dce3e5;border-radius:12px;padding:20px;margin:14px 0}h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;margin:8px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.grid section{margin:0}.tag{font-size:12px;color:#52676e;background:#eaf0f1;border-radius:5px;padding:3px 8px;display:inline-block}.warn{border-left:3px solid #b87927;padding:8px 12px;background:#fff8eb}.tabs{display:flex;gap:8px;flex-wrap:wrap}input,textarea{font:inherit;width:100%;min-width:0;border:1px solid #b9c9cd;border-radius:6px;padding:8px;background:white}label{display:block;margin:8px 0}table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{text-align:left;padding:9px 4px;border-bottom:1px solid #e0e7e8;overflow-wrap:anywhere}details{margin:10px 0}summary{cursor:pointer;color:#205b61} .line{border-top:1px solid #e0e7e8;padding:12px 0} @media(max-width:700px){.layout{display:block}aside{padding:10px}nav{display:flex;flex-wrap:wrap;gap:3px}nav button{font-size:13px;padding:6px 9px}main{padding:15px}section{padding:15px}h1{font-size:25px}header{padding:12px 15px}td,th{font-size:12px}}
</style><header><strong>Marketing Studio</strong><span class="muted">Industrial Service · Sample workspace</span></header><div class="layout"><aside><small>WORKSPACE</small><nav id="nav"></nav><p><small>Interactive rule-based prototype<br>Synthetic evidence · No live AI</small></p></aside><main id="main"></main></div><script type="module">
import{sample,evaluate,affected}from './engine.mjs';
const names=['Overview','Work','Company knowledge','Results','Decisions','Marketing Map','Management'];const labels={own:'Our offer',a:'Competitor A',b:'Competitor B'},keys={price:'Annual price (€)',response:'Response (hours)',visits:'Planned visits'};let page=0,tab='Summary';let s;try{s=JSON.parse(localStorage.getItem('ms-workspace-v2'))}catch{}s=s||{data:structuredClone(sample),results:null,stale:[],history:[],linked:false,conflicts:{}};s.conflicts||={};const save=()=>localStorage.setItem('ms-workspace-v2',JSON.stringify(s));const el=document.querySelector('#main');const esc=x=>String(x??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const go=i=>{page=i;tab='Summary';render()};const btn=(t,i)=>'<button data-go="'+i+'">'+t+'</button>';const title=(a,b)=>'<small>'+a+'</small><h1>'+b+'</h1>';function run(){const d=structuredClone(s.data);for(const p of Object.keys(s.conflicts)){const [a,k]=p.split('.');d[a][k]=null}s.results=evaluate(d);s.stale=s.stale.filter(x=>x==='H01');s.history.push('Comparison calculated; unresolved conflicts excluded.');save();go(3)}
function change(a,k,v){const p=a+'.'+k;if(s.data[a][k]===v)return;s.data[a][k]=v;s.stale=[...new Set([...s.stale,...affected(p)])];s.history.push(labels[a]+' · '+keys[k]+' changed');save();render()}
function inputs(){return '<div class="grid">'+Object.entries(s.data).map(([a,o])=>'<section><h3>'+labels[a]+'</h3><small>Source: fictional offer '+a.toUpperCase()+'</small>'+Object.entries(keys).map(([k,n])=>'<label>'+n+'<input type="number" min="0" data-field="'+a+'.'+k+'" value="'+esc(o[k]??'')+'"></label>').join('')+'<details><summary>Source and scope</summary>Sample annual industrial maintenance offer. Values are declared, not independently verified. Contract equivalence assumed for the sample; geography, tax and response definition unverified.</details></section>').join('')+'</div><section><h3>Conflicting evidence</h3><p>Test a second fictional source reporting competitor B annual price of €5,100. Do not average conflicting observations.</p><button id="conflict">'+(s.conflicts['b.price']?'Resolve conflict: retain original sample source':'Add conflicting source')+'</button>'+(s.conflicts['b.price']?'<p class="warn">B price: '+esc(s.data.b.price)+' vs 5100. Unresolved.</p>':'')+'</section>'}
function method(){return '<section><h2>Method and limits</h2><p>Compare declared offer attributes under common conditions. Missing values are not zero. Different visit volumes limit price comparison. A difference does not establish customer value.</p><p>Inputs: offer observations, scope and definitions. Output: comparative findings, limitations and evidence gaps. Executor: deterministic calculation and rules. No autonomous research.</p><p>Other alternatives: in-house service, substitutes and no action — not researched.</p></section>'}
function results(){if(!s.results)return '<section><h2>No saved result yet</h2>'+btn('Open comparison',1)+'</section>';return '<section><h2>Comparative findings</h2>'+s.results.map(r=>{const other=labels[r.other||'b'];const label=r.key==='price'?'Annual price':'Declared response time';const delta=r.delta;return '<div class="line"><strong>'+label+' · '+other+'</strong><p>'+(s.stale.includes(r.id)?'<span class="tag">Review required · previous finding</span> ':'')+(delta===null?'Insufficient comparable evidence.':delta===0?'No nominal difference.':'Our offer is '+(delta<0?'lower':'higher')+' by '+Math.abs(delta)+(r.key==='price'?' EUR':' hours')+'.')+'</p><small>'+(r.status==='conditional'?'Conditional: service volumes or scope differ.':r.status==='insufficient'?'Missing or conflicting observation.':'Sample scope assumed; other terms unverified.')+'</small><details><summary>Grounds</summary>'+r.deps.map(esc).join(' · ')+'<p>Fictional offer cards; see Company knowledge.</p>'+btn('Open sources',2)+'</details></div>'}).join('')+'</section><section><h2>Use this result</h2><p>Finish this work here, or investigate whether response time matters to buyers.</p><button id="link">Use findings in offer assessment</button> <button id="export">Export saved findings</button></section>'}
function render(){document.querySelector('#nav').innerHTML=names.map((n,i)=>'<button data-go="'+i+'" class="'+(i===page?'active':'')+'">'+n+'</button>').join('');let h='';
if(page===0)h=title('YOUR COMPANY','What would you like to achieve?')+'<p>Professional marketing work, grounded in your company knowledge.</p><section><h2>Start with a business need</h2><p>Explore the working example: how does our service offer compare with competitors?</p><button class="primary" data-go="1">Compare competitive offers</button><p><small>Free-form AI routing is planned, not available in this demo.</small></p></section><div class="grid"><section><h2>Assess your marketing</h2><p>Self-assessment of practices.</p><span class="tag">Separate prototype · not integrated</span></section><section><h2>Continue your work</h2><p>Competitive offer comparison</p>'+btn(s.results?'Open saved result':'Open task',s.results?3:1)+'</section></div>';
if(page===1)h=title('WORK / COMPETITIVE RESEARCH','Compare service offers')+'<p>Goal: establish comparable differences and evidence gaps, not approve a new offer.</p><section><span class="tag">'+(s.results?'Result saved':'Ready for input review')+'</span><h2>Review inputs</h2><p>Check declared annual prices, response times and visits. Blank means unknown.</p>'+inputs()+'<button class="primary" id="run">Run comparison</button></section>'+method();
if(page===2)h=title('COMPANY KNOWLEDGE','Offers and observations')+'<p>Persistent sample entities, sources and editable observations. Changes are recorded.</p>'+inputs()+'<section><h2>Change history</h2>'+s.history.map(x=>'<p>'+esc(x)+'</p>').join('')+'</section>';
if(page===3)h=title('RESULTS / COMPETITIVE RESEARCH','How does our offer compare?')+'<p>Saved professional result · synthetic data</p><div class="tabs">'+['Summary','Method','History'].map(t=>'<button data-tab="'+t+'">'+t+'</button>').join('')+'</div>'+(tab==='Method'?method():tab==='History'?'<section>'+s.history.map(x=>'<p>'+esc(x)+'</p>').join('')+'</section>':results())+(s.stale.some(x=>x!=='H01')?'<button id="run">Review changed findings</button>':'');
if(page===4)h=title('DECISIONS','Offer assessment')+'<section><h2>Customer value hypothesis</h2><span class="tag">'+(s.stale.includes('H01')?'Review required':'Unverified')+'</span><p>Response speed may influence buyer choice. '+(s.linked?'Linked to saved response-time finding.':'No result linked yet.')+'</p><p class="warn">Customer priorities, willingness to pay, feasibility and economics are missing. No SLA or positioning decision is approved.</p>'+btn('Review comparative findings',3)+'</section><section><h2>Next evidence needed</h2><p>Interview buyers about response-time requirements; assess operational capacity and cost. Approval remains with the owner after evidence review.</p></section>';
if(page===5)h=title('PROFESSIONAL KNOWLEDGE','Marketing Map')+'<p>Subject structure · reference view, not a complete interactive knowledge graph.</p><div class="grid">'+['Environment','Market actors','Buyers','Demand','Competition','Value','Brand','Pricing','Channels','Communications','Relationships and sales','Organization','Data'].map((n,i)=>'<section><small>T'+(i+1)+'</small><h3>'+n+'</h3>'+(i===4?btn('Open related work',1):'')+'</section>').join('')+'</div>';
if(page===6)h=title('MANAGEMENT','Marketing management')+'<p>Independent or connected professional tools. Not integrated into this demonstration.</p><div class="grid">'+['Strategy','Annual plan','Budget','Management and control'].map((n,i)=>'<section><h2>'+n+'</h2><span class="tag">'+(i===3?'In development':'Separate prototype')+'</span></section>').join('')+'</div>';
el.innerHTML=h+'<p><small>Local browser storage · sample only</small> <button id="reset">Reset sample</button></p>';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-field]').forEach(b=>b.onchange=()=>{const [a,k]=b.dataset.field.split('.');const v=b.value===''?null:Number(b.value);if(v!==null&&(!Number.isFinite(v)||v<0)){render();return}change(a,k,v)});const bind=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn};bind('run',run);bind('conflict',()=>{if(s.conflicts['b.price'])delete s.conflicts['b.price'];else s.conflicts['b.price']=5100;s.stale=[...new Set([...s.stale,...affected('b.price')])];s.history.push('B price conflict status changed');save();render()});bind('link',()=>{s.linked=true;save();go(4)});bind('export',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({sample:true,results:s.results,stale:s.stale,history:s.history},null,2)],{type:'application/json'}));a.download='comparison.json';a.click();URL.revokeObjectURL(a.href)});bind('reset',()=>{localStorage.removeItem('ms-workspace-v2');location.reload()})}render();
</script></html>
