let lang="en",screen=0,answers={},demo=false,scope="product",stage="active",mode="problem";
function questions(){return mode==="general"?general:original}
function entriesCount(){return questions().length}
function selectEntry(which){mode=which;answers={};demo=false;go(1)}
const $=id=>document.getElementById(id),L=()=>tr[lang],txt=(x)=>x[lang==="en"?0:1],escape=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function setLang(next){lang=next;render()}
function go(next){if(next<0||next>3)return;if(next>=2&&!questions().every(q=>answers[q.n]))next=1;screen=next;render();window.scrollTo({top:0,behavior:"smooth"})}
function jumpToStep(i){if(i<=screen)go(i)}
function changeAnswer(n){go(1);const el=document.getElementById("question-"+n);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})}
function resetAll(){if(window.confirm(L().resetConfirm)){answers={};demo=false;go(1)}}
function setAnswer(n,value){answers[n]=value;demo=false;render()}
function setScope(v){scope=v}
function setStage(v){stage=v}
function demoAnswers(){
 if(mode==="general"){const sample=["yes","partial","no","unknown","yes","partial","no","yes","partial","unknown","no","yes","partial"];answers={};for(let i=1;i<=13;i++)answers[i]=sample[i-1];}
 else answers={3:"no",5:"partial",2:"yes",6:"yes",8:"unknown",9:"partial"};
 demo=true;go(2)
}
function clearAnswers(){resetAll()}
function begin(){go(1)}
function showResults(){if(questions().every(q=>answers[q.n]))go(2)}
function name(n){return areas[n-1][lang==="en"?0:1]}
function initShell(){const t=L();$("hdrSub").textContent=t.sub;$("kicker").textContent=t.kicker;$("headline").textContent=t.headline;$("lead").textContent=t.lead;$("footer").textContent=t.footer;
$("langEn").classList.toggle("active",lang==="en");$("langRu").classList.toggle("active",lang==="ru");
$("steps").innerHTML=t.steps.map((x,i)=>'<button type="button" class="step '+(screen===i?"current":screen>i?"complete":"")+'" '+(i>screen?"disabled":"")+' onclick="jumpToStep('+i+')">'+(i+1)+'. '+escape(x)+'</button>').join("");
$("sidebar").innerHTML='<h3>'+escape(t.sideTitle[screen])+'</h3>'+t.side[screen].map((s,i)=>'<p'+(i===2?' class="notice"':'')+'>'+escape(screen===1&&i===0&&mode==="general"?(lang==="en"?"The working prototype asks 13 general questions, one per marketing domain.":"Прототип задаёт 13 общих вопросов — по одному на область маркетинга."):s)+'</p>').join("");
}
function renderStart(){const t=L();
$("stage").innerHTML='<div class="label">'+escape(t.steps[0])+'</div><h2>'+escape(lang==="en"?"Choose how to begin":"Выберите способ начала работы")+'</h2>'+
'<p class="explain">'+escape(lang==="en"?"Both routes use the same 13-domain Marketing Map. They serve different starting needs.":"Оба маршрута используют одну карту из 13 областей, но начинаются с разных потребностей.")+'</p>'+
'<button class="choice" onclick="selectEntry(\'problem\')"><span><strong>'+escape(t.businessEntry)+'</strong><small>'+escape(t.businessHint)+'</small></span><span class="go">→</span></button>'+
'<button class="choice" onclick="selectEntry(\'general\')"><span><strong>'+escape(t.generalEntry)+'</strong><small>'+escape(t.generalHint)+'</small></span><span class="go">→</span></button>'+
'<div class="routebox"><p class="routeTitle">'+escape(lang==="en"?"TWO ENTRIES · ONE PROFESSIONAL MODEL":"ДВА ВХОДА · ОДНА ПРОФЕССИОНАЛЬНАЯ МОДЕЛЬ")+'</p>'+
'<div class="routeLine"><div class="routeNode">'+escape(lang==="en"?"Your need":"Ваша потребность")+'</div><span class="routeArrow">→</span>'+
'<div class="routeNode">Marketing Map<br><small>13 areas</small></div><span class="routeArrow">→</span>'+
'<div class="routeNode">'+escape(lang==="en"?"Checks and next steps":"Проверки и следующие шаги")+'</div></div></div>'+
'<div class="callout">'+escape(lang==="en"?"Both routes use the existing self-assessment logic. Automated research, decision rules and their integration are planned.":"Оба входа используют существующую самодиагностику. Автоматизированные исследования, правила решений и их интеграция ещё планируются.")+'</div>';
}
function renderQuestions(){const t=L(),f=lang==="en"?0:1,qset=questions();
$("stage").innerHTML='<div class="label">'+escape(t.steps[1])+'</div><h2>'+escape(mode==="general"?(lang==="en"?"13-area company self-assessment":"Самооценка компании по 13 областям"):t.questionTitle)+'</h2><p class="explain">'+escape(mode==="general"?(lang==="en"?"Rate one practice in each marketing area. This is self-report, not an effectiveness score.":"Оцените по одной практике в каждой области. Это самооценка, а не оценка эффективности."):t.questionDesc)+'</p>'+
'<div class="context"><label class="field"><span>'+escape(t.scope)+'</span><select onchange="setScope(this.value)"><option value="product" '+(scope==="product"?"selected":"")+'>'+escape(t.scopeOpts[0])+'</option><option value="company" '+(scope==="company"?"selected":"")+'>'+escape(t.scopeOpts[1])+'</option></select></label><label class="field"><span>'+escape(t.stage)+'</span><select onchange="setStage(this.value)"><option value="active" '+(stage==="active"?"selected":"")+'>'+escape(t.stageOpts[0])+'</option><option value="new" '+(stage==="new"?"selected":"")+'>'+escape(t.stageOpts[1])+'</option></select></label></div>'+
qset.map(q=>'<div class="question" id="question-'+q.n+'"><div class="qhead"><span class="qtag">T'+q.n+'</span><span class="qtext">'+escape(q.q[f])+'</span></div><div class="answers">'+["yes","partial","no","unknown","na"].map((v,i)=>'<button class="ans '+(answers[q.n]===v?"active":"")+'" onclick="setAnswer('+q.n+',\''+v+'\')" aria-pressed="'+(answers[q.n]===v)+'">'+escape(t.answers[i])+'</button>').join("")+'</div></div>').join("")+
'<div class="controls"><button class="primary" '+(!qset.every(q=>answers[q.n])?"disabled":"")+' onclick="showResults()">'+escape(t.next)+' → ('+qset.filter(q=>answers[q.n]).length+'/'+qset.length+')</button><button class="secondary" onclick="go(0)">← '+escape(t.home)+'</button><button class="secondary" onclick="clearAnswers()">'+escape(t.clear)+'</button></div><div class="callout"><b>'+escape(t.scenario)+'</b><p class="caption">'+escape(t.scenarioHint)+'</p><button class="secondary" onclick="demoAnswers()">'+escape(t.scenario)+' →</button></div>';
}
function risk(q){return ["no","partial","unknown"].includes(answers[q.n])}
function priorityList(){return questions().filter(risk)}

const generalTargetLevels=[6,6,8,7,7,8,5,7,8,6,8,6,7];
const requirementProfiles={
0:{primary:[3,4,6],supporting:[9,10,13],context:[2,5]},
1:{primary:[3,6],supporting:[2,5,8,9],context:[11]},
2:{primary:[8,6],supporting:[13,12,4],context:[9]},
3:{primary:[4,2,6],supporting:[1,5,9],context:[3,10]},
4:{primary:[11,6],supporting:[7,12,13],context:[3]}
};
function radarSvg(){
 const cx=151,cy=148,r=106,step=Math.PI*2/13;
 const polar=(i,v)=>{const a=-Math.PI/2+i*step;return [cx+r*v*Math.cos(a),cy+r*v*Math.sin(a)]};
 const poly=vs=>vs.map((v,i)=>polar(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
 const actual=areas.map((_,i)=>({yes:.83,partial:.52,no:.18})[answers[i+1]]??null);
 const target=mode==="general"?generalTargetLevels.map(v=>v/10):areas.map((_,i)=>{const p=requirementProfiles[typeof scenario==="number"?scenario:1],n=i+1;return p.primary.includes(n)?.8:p.supporting.includes(n)?.7:p.context.includes(n)?.5:null});
 const plottedTarget=target.map(x=>x===null?.15:x),plottedActual=actual.map(x=>x===null?.5:x);
 let h='<svg class="radar" viewBox="0 0 305 310" role="img" aria-label="Target reference and actual self-report, 13 domains">';
 for(const k of [.25,.5,.75,1])h+='<polygon points="'+poly(Array(13).fill(k))+'" fill="none" stroke="#dce8df"/>';
 for(let i=0;i<13;i++){const p=polar(i,1);h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#dce8df"/>'}
 h+='<polygon points="'+poly(plottedTarget)+'" stroke="#12816c" stroke-width="2.5" stroke-dasharray="5 3" fill="#12816c" fill-opacity=".07"/>';
 h+='<polygon points="'+poly(plottedActual)+'" stroke="#d98a42" stroke-width="2.5" fill="#d98a42" fill-opacity=".07"/>';
 for(let i=0;i<13;i++){
  const n=i+1,pos=polar(i,plottedActual[i]),lab=polar(i,1.2);
  h+='<text x="'+lab[0]+'" y="'+(lab[1]+4)+'" font-size="10" text-anchor="middle" fill="currentColor">T'+n+'</text>';
  if(target[i]!==null){const g=polar(i,target[i]);h+='<circle cx="'+g[0]+'" cy="'+g[1]+'" r="3.5" fill="#12816c"/>'}
  h+='<circle cx="'+pos[0]+'" cy="'+pos[1]+'" r="4.5" fill="'+(actual[i]===null?"white":"#d98a42")+'" stroke="#d98a42" stroke-width="1.5"/>';
 }
 return h+"</svg>";
}

function renderResults(){const t=L(),gaps=priorityList(),f=lang==="en"?0:1;
$("stage").innerHTML='<div class="label">'+escape(t.steps[2])+'</div><h2>'+escape(mode==="general"?(lang==="en"?"Your 13-domain marketing self-assessment":"Ваша самооценка по 13 областям"):t.resultTitle)+'</h2><p class="explain">'+escape(mode==="general"?(lang==="en"?"All 13 areas were asked. Responses are self-reported practices, not validated marketing maturity.":"Оценены все 13 областей. Ответы — самооценка практик, а не валидированная зрелость маркетинга."):t.resultDesc)+'</p>'+(demo?'<div class="status plan">'+escape(t.fiction)+'</div>':'<div class="status">'+escape(t.real)+'</div>')+
'<div class="results"><div>'+radarSvg()+'<p class="legend"><i></i>'+escape(t.chartLabel)+'<br><i class="empty"></i>'+escape(t.notAssessed)+'</p></div><div><h3 style="margin:0 0 12px;font-size:18px">'+escape(t.findingTitle)+'</h3>'+
(gaps.length?gaps.map(q=>'<div class="finding"><b>T'+q.n+' · '+escape(name(q.n))+'</b><button class="secondary" style="float:right;padding:5px 8px;font-size:11px" onclick="changeAnswer('+q.n+')">'+escape(t.edit)+'</button><span class="flag">'+escape(answers[q.n]==="unknown"?t.unknown:t.priority)+'</span><span>'+escape(q.action[f])+'</span></div>').join(""):'<div class="finding">'+escape(t.noGaps)+'</div>')+
'</div></div>'+
(answers[6]==="yes"&&answers[3]==="no"?'<div class="callout"><b>'+escape(t.other)+'</b><div>'+escape(t.possible)+'</div></div>':'')+
'<p class="caption"><b>'+escape(t.source)+'</b>: '+questions().map(q=>q.code+' → '+q.link).join(' · ')+'</p><div class="controls"><button class="primary" onclick="go(3)">'+escape(t.nextMaster)+' →</button><button class="secondary" onclick="go(1)">← '+escape(t.edit)+'</button></div>';
}
function renderMaster(){const t=L(),f=lang==="en"?0:1,gaps=priorityList();const priorities=gaps.filter(q=>answers[q.n]!=="unknown").slice(0,3);const list=priorities.length?priorities.map(q=>'T'+q.n+' · '+name(q.n)).join(" · "):(lang==="en"?"No missing/partial practice reported":"Отсутствующие или частичные практики не заявлены");
$("stage").innerHTML='<div class="label">'+escape(t.steps[3])+'</div><h2>'+escape(t.masterTitle)+'</h2><p class="explain">'+escape(t.masterDesc)+'</p>'+
'<div class="chain">'+
'<div class="chainItem"><span class="num">01 · '+escape(t.working)+'</span><h3>'+escape(t.master1)+'</h3><p>'+escape(t.master1Desc)+'</p><p><strong>'+escape(mode==="general"?t.generalProblem:t.problem)+'</strong><br>'+escape(list)+'</p></div><div class="down">↓</div>'+
'<div class="chainItem"><span class="num">02 · '+escape(t.working)+'</span><h3>'+escape(t.master2)+'</h3><p>'+escape(t.master2Desc)+'</p>'+(priorities.length?'<p>'+priorities.map(q=>escape(q.action[f])).join(' ')+'</p>':'')+'</div><div class="down">↓</div>'+
'<div class="chainItem"><span class="num">03 · '+escape(t.method)+'</span><h3>'+escape(t.master3)+'</h3><p>'+escape(t.master3Desc)+'</p></div><div class="down">↓</div>'+
'<div class="chainItem"><span class="num">04 · '+escape(t.planned)+'</span><h3>'+escape(t.master4)+'</h3><p>'+escape(t.master4Desc)+'</p></div></div>'+
'<div class="callout"><strong>'+escape(t.end)+'</strong></div><div class="controls"><button class="secondary" onclick="go(2)">← '+escape(t.return)+'</button><button class="secondary" onclick="resetAll()">'+escape(t.restart)+'</button></div>';
}
function render(){initShell();if(screen===0)renderStart();if(screen===1)renderQuestions();if(screen===2)renderResults();if(screen===3)renderMaster();}
render();
</script>
