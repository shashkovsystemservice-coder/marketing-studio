<title>Marketing Studio — Start-Up Chile working prototype</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#18392f;background:#f3f6f2;font-size:16px}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e8a84d;outline-offset:3px}[hidden]{display:none!important}

.logo{font-weight:850;font-size:15px;letter-spacing:.09em}.subtitle{font-size:11px;color:#c5e6d5;margin-top:3px}.languages{display:flex;gap:5px}
.language{border:1px solid #7ba593;color:white;background:transparent;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:750}
.language.active{background:#fff;color:#194c38}
main{max-width:1160px;margin:auto;padding:23px 24px 40px}
.kicker{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:850;color:#2a8567}
h1{font-size:clamp(30px,4.0vw,48px);line-height:1.1;letter-spacing:-.05em;margin:8px 0 12px;max-width:900px}
.lead{font-size:17px;line-height:1.5;max-width:870px;color:#51695e;margin:0 0 20px}
.steps{display:flex;gap:8px;margin:0 0 18px}.step{flex:1;border:1px solid #d6e3d9;background:white;border-radius:10px;padding:10px 13px;color:#4e7060;font-size:13px;font-weight:750}
.step:disabled{cursor:default;opacity:.55}.step.current{background:#175b45;color:#fff;border-color:#175b45}.step.complete{background:#e5f2e9;color:#175b45}
.step.nextAction{border:2px solid #21865f;background:#e6f7ed;color:#165941;cursor:pointer;font-weight:850;padding:9px 12px;box-shadow:0 0 0 3px #c9ead654}
.step.nextAction:after{content:" →"}
.resultNext{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#edf7ef;border:1px solid #a4d1b4;border-radius:12px;padding:15px 17px;margin:0 0 23px}
.resultNext strong{display:block;font-size:15px;color:#1d654a}.resultNext p{font-size:12px;color:#547462;margin:4px 0 0;line-height:1.4;max-width:340px}
.resultNext .primary{padding:12px 16px;font-size:14px;white-space:nowrap}
.checksIntro{padding:13px 16px;background:#f2f8f3;border:1px solid #d0e5d5;border-radius:10px;margin:12px 0 18px}
.checksIntro p{font-size:13px;line-height:1.5;margin:5px 0;color:#486b56}
@media(max-width:650px){.resultNext .primary{width:100%}}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}
.stage{background:white;border:1px solid #d7e5dc;border-radius:18px;padding:27px 31px;box-shadow:0 12px 34px #14372a09;min-height:480px}
.sidebar{background:#eaf3ed;border-radius:16px;padding:21px;border:1px solid #d6e6dc}
.sidebar h3{font-size:17px;margin:0 0 10px}.sidebar p{font-size:14px;line-height:1.6;margin:8px 0;color:#416554}
.sidebar strong{color:#204b3b}.sidebar .notice{border-left:3px solid #bd934a;padding-left:10px}
h2{font-size:25px;letter-spacing:-.03em;margin:3px 0 10px;line-height:1.2}
.explain{font-size:15px;line-height:1.6;color:#586f62;margin:0 0 20px}
.choice{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;background:#f9fbf9;color:#18392f;border:1px solid #d5e3da;border-radius:14px;padding:20px;gap:15px;margin:10px 0}
.choice:hover,.choice:focus-visible{border-color:#2d8868;background:#f1f9f2}
.choice strong{display:block;font-size:19px;margin-bottom:6px}.choice small{font-size:13px;color:#60766b;line-height:1.4;display:block}.choice .go{font-size:24px;color:#247858}
.layout.startOnly{grid-template-columns:minmax(0,760px);justify-content:center}.layout.startOnly .stage{min-height:0}.routebox{margin-top:18px;border:1px solid #d4e5db;background:#f4f8f5;border-radius:13px;padding:17px}
.routeTitle{font-size:12px;color:#357359;font-weight:800;letter-spacing:.05em;margin:0 0 12px}
.routeLine{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
.routeNode{background:white;border:1px solid #bed6c7;border-radius:10px;padding:12px 14px;text-align:center;font-size:13px;font-weight:700;flex:1;min-width:105px}
.routeArrow{color:#298160;font-size:20px;font-weight:bold}
@media(max-width:600px){.routeNode{min-width:95px}.routeLine{gap:5px}}

.label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#247858;font-weight:850;margin:0 0 8px}
.context{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
select{padding:10px;background:white;border:1px solid #c7d9cd;border-radius:8px;font:inherit;font-size:14px;max-width:100%}
.field span{display:block;font-size:12px;color:#526c5f;margin-bottom:5px}
.question{margin:0 0 15px;border-bottom:1px solid #e4ede6;padding-bottom:14px}
.qhead{display:flex;gap:12px;align-items:baseline;margin-bottom:9px}
.qtag{color:#2c8667;font-size:12px;font-weight:850;min-width:34px}.qtext{font-size:16px;font-weight:650;line-height:1.4}
.answers{display:flex;gap:7px;flex-wrap:wrap;margin-left:45px}
.ans{font-size:12px;font-weight:650;padding:8px 10px;border-radius:8px;border:1px solid #d4e2d7;background:#f7faf7;color:#436353}
.ans.active{background:#1b684f;color:#fff;border-color:#1b684f}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.primary{background:#176148;color:white;border:1px solid #176148;padding:13px 21px;border-radius:10px;font-size:15px;font-weight:800}
.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:white;border:1px solid #c3d8cb;color:#1b674f;padding:12px 17px;border-radius:10px;font-weight:750;font-size:14px}
.caption{font-size:12px;color:#62776c;line-height:1.5}
.results{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
.radar{width:100%;max-width:320px;display:block}
.legend{font-size:12px;color:#5b7164;line-height:1.55}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d88f43;margin-right:6px}
.legend .empty{background:white;border:1px solid #5c8b77}
.finding.critical{border-left:5px solid #bd4943}.finding.moderate{border-left:5px solid #d99b3f}.finding.unknown{border-left:5px solid #86958d}.finding.meets{border-left:5px solid #2d876c}
.summaryStats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0 23px}.stat{border:1px solid #dce5df;border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.stat small{font-size:11px;color:#617569}.stat.critical{border-color:#e2a8a0;color:#ab4039}.stat.moderate{border-color:#e4c190;color:#a86f2b}.stat.meets{color:#247858}
.taskSteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:16px 0}.taskStep{border:1px solid #d1e4d7;background:#f7faf8;border-radius:12px;padding:14px}.taskStep b{font-size:14px;display:block}.taskStep p{font-size:12px;color:#557165;line-height:1.5}.gatePanel{border:1px solid #d6e4da;border-radius:13px;padding:17px;margin:12px 0;background:#f8faf7}.gatePanel h3{margin:2px 0 8px}.gatePanel p{font-size:14px;line-height:1.5;color:#547061}.gatePanel .ans{margin:3px}.gateStatus{padding:10px;border-radius:8px;background:#f0f5ef;font-size:13px;line-height:1.5;margin-top:10px}.gateStatus.return{background:#fff1e5;color:#9c522e}.gateStatus.ok{background:#e6f4ed;color:#236f53}
@media(max-width:680px){.summaryStats{grid-template-columns:repeat(2,1fr)}.taskSteps{grid-template-columns:1fr}}
.finding{padding:12px 15px;border-radius:11px;background:#f7faf7;border:1px solid #e0e9e0;margin:0 0 9px}
.finding b{font-size:14px}.finding span{font-size:13px;color:#586e62;line-height:1.45;display:block;margin-top:5px}
.flag{font-size:11px;color:#986323;margin-left:8px}.good{color:#1a7d5b}
.masterVisual{padding:18px;background:#f8faf8;border:1px solid #d5e5da;border-radius:14px;margin:12px 0 22px}.masterVisual svg{width:100%;height:auto;display:block}.masterVisual .explain{margin-bottom:12px}.masterVisual .secondary{text-decoration:none;display:inline-block}.chain{display:grid;gap:9px}
.chainItem{background:#f4f8f5;border:1px solid #d9e9dd;border-radius:13px;padding:16px}
.chainItem .num{color:#287e5d;font-size:12px;font-weight:850}.chainItem h3{font-size:17px;margin:5px 0 6px}
.chainItem p{font-size:14px;line-height:1.5;margin:0;color:#506d5e}.down{text-align:center;font-size:22px;color:#3d8c71}
.status{display:inline-block;border-radius:7px;background:#e5f2e9;padding:5px 9px;color:#216b50;font-weight:750;font-size:11px;margin:8px 0}
.status.plan{background:#fff2de;color:#90631b}.callout{background:#f5f8f2;border-left:4px solid #2c8667;padding:16px;font-size:14px;line-height:1.6;margin:15px 0}
.foot{margin-top:20px;color:#657a6e;font-size:12px;line-height:1.5}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{min-height:0}.results{grid-template-columns:1fr}.radar{max-width:300px}.stage{min-height:0}}
@media(max-width:600px){main{padding:17px 13px}.top{padding:12px 13px}.stage{padding:19px 15px}.steps{gap:4px}.step{padding:9px 5px;font-size:10px;text-align:center}.answers{margin-left:0}.qtext{font-size:14px}.ans{font-size:11px}.layout{gap:12px}}

.demoLaunch{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;border:2px solid #79b89a;border-radius:13px;background:#eaf6ee;padding:16px 18px;margin:14px 0 19px}
.demoLaunch strong{font-size:17px;color:#18573f;display:block;margin-bottom:5px}
.demoLaunch p{font-size:13px;color:#516f60;line-height:1.45;margin:0}
.demoLaunch .primary{font-size:14px;padding:13px 17px}
.demoSampleBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#e8f4ec;border:1px solid #acd4bb;padding:11px 13px;border-radius:10px;margin:10px 0}
.demoSampleBar strong{font-size:13px}.demoSampleBar span{font-size:12px;color:#536c5b}
.demoSampleBar .primary{padding:9px 12px;font-size:13px}
@media(max-width:620px){.demoLaunch{grid-template-columns:1fr}.demoLaunch .primary{width:100%}}
.backToMap{display:inline-flex;margin:10px auto 0;color:#d7efe3;text-decoration:none;font-size:12px;font-weight:700;border:1px solid #77aa8f;padding:7px 10px;border-radius:8px}.backToMap:hover{background:#216749}</style>

<script>
"use strict";
// The six concrete prompts and links are derived from the frozen assessment (15 Nov 2026).
// No simulated customer validation, automated research or executable MASTER integration is claimed.
const areas=[
["Environment","Среда"],["Stakeholders","Участники"],["Buyer behavior","Поведение покупателя"],
["Market & demand","Рынок и спрос"],["Competition","Конкуренция"],
["Value proposition","Ценность и предложение"],["Brand","Бренд"],["Pricing","Цена"],
["Channels","Каналы"],["Communication","Коммуникации"],
["Relationships & sales","Отношения и продажи"],["Organization","Организация"],["Data","Данные"]];
const original=[
{n:3,code:"T3.09",link:"REL.005 · MEC.006",q:["Do you ask customers which criteria they use to compare your offering with alternatives?","Вы выясняете у покупателей, по каким критериям они сравнивают ваше предложение с альтернативами?"],action:["Ask several buyers what mattered most when they compared options.","Спросите нескольких покупателей, что было решающим при сравнении вариантов."]},
{n:5,code:"T5.05",link:"MEC.009",q:["Do you investigate other ways customers can solve the same problem?","Вы выясняете, какими другими способами покупатели могут решить ту же задачу?"],action:["List direct competitors and alternative ways to solve the customer's problem.","Составьте перечень прямых конкурентов и других способов решить задачу."]},
{n:2,code:"T2.07",link:"REL.005",q:["Do you know who actually makes the purchase decision?","Вы выясняете, кто принимает решение о покупке вашего предложения?"],action:["Identify who chooses, pays for and uses the offering.","Определите, кто выбирает, кто оплачивает и кто использует предложение."]},
{n:6,code:"T6.06",link:"REL.014–015 · MEC.011",q:["Can you explain the specific value of your offering for the buyers you target?","Для выбранных покупателей вы можете сформулировать конкретную пользу вашего предложения?"],action:["Link your value promise to a customer's need, then check their understanding.","Свяжите обещаемую пользу с задачей покупателя и проверьте её понимание."]},
{n:8,code:"T8.07",link:"REL.021 · MEC.014",q:["Do you investigate what price and payment terms buyers are willing to accept?","Вы выясняете, какую цену и условия оплаты покупатели готовы принять?"],action:["Check willingness to pay for a defined offer in a specific context.","Проверьте готовность платить за конкретное предложение в определённой ситуации."]},
{n:9,code:"T9.07",link:"REL.024 · MEC.017",q:["Do you check whether target customers can actually obtain your offering?","Вы проверяете, может ли целевой покупатель реально получить ваше предложение?"],action:["Follow the buyer's path from decision to actual product delivery.","Пройдите путь от решения купить до фактического получения продукта."]}
];
const general=[{"n":1,"code":"T1.09","link":"MEC.002","q":["When external changes may affect your business, do you determine their impact and adjust decisions when necessary?","Когда внешние изменения могут затронуть ваш бизнес, вы определяете их значение и меняете решения при необходимости?"],"action":["Choose one important external change and identify which business decisions it affects.","Выберите одно значимое внешнее изменение и определите, какие решения оно затрагивает."]},{"n":2,"code":"T2.07","link":"REL.005","q":["Do you identify who chooses, pays for and uses your offering, and account for these different roles?","Вы выясняете, кто участвует в выборе, оплате и использовании предложения, и учитываете эти роли?"],"action":["Map the people involved in a typical purchase and the interests that need consideration.","Определите участников типичной покупки и интересы, которые нужно учесть."]},{"n":3,"code":"T3.09","link":"REL.005 · MEC.006","q":["Do you learn why customers choose your offering or an alternative, and use those insights?","Вы узнаёте, почему клиенты выбирают ваше предложение или альтернативу, и используете эти сведения?"],"action":["Ask buyers about real reasons for choosing or rejecting an offering.","Узнайте у покупателей реальные причины выбора и отказа."]},{"n":4,"code":"T4.06","link":"REL.007–008 · MEC.008","q":["Do you define priority customer groups and check whether there is enough demand?","Вы определяете приоритетные группы покупателей и проверяете, достаточно ли в них спроса?"],"action":["Describe one priority customer group and how you could test demand.","Опишите приоритетную группу покупателей и способ проверить спрос."]},{"n":5,"code":"T5.05","link":"MEC.009","q":["Do you study the alternatives available to buyers and use what you learn when choosing actions?","Вы изучаете альтернативы покупателя и используете выводы при выборе своих действий?"],"action":["Identify the alternatives customers compare with your offering.","Установите альтернативы, с которыми вас сравнивают покупатели."]},{"n":6,"code":"T6.06","link":"REL.014–015 · MEC.011","q":["Do you shape your offer around customer needs and check the benefits customers actually get?","Вы формируете предложение на основе задач покупателей и проверяете, какую пользу они получают?"],"action":["Check whether the offer solves the buyer's task and what benefit they receive.","Проверьте, соответствует ли предложение задаче покупателя и какую пользу он получает."]},{"n":7,"code":"T7.05","link":"MEC.021","q":["Do you learn how buyers perceive your company and examine gaps between perception and promises?","Вы узнаёте, как покупатели воспринимают компанию, и учитываете расхождение с обещаниями?"],"action":["Compare the company's promise with actual customer perceptions.","Сопоставьте обещание компании с восприятием покупателей."]},{"n":8,"code":"T8.07","link":"REL.021 · MEC.014","q":["Do you justify prices and terms using information about buyers and the market?","Вы обосновываете цену и условия предложения, используя сведения о покупателях и рынке?"],"action":["Record what evidence supports the price and when to revisit it.","Зафиксируйте сведения, на которых основана цена, и условия её пересмотра."]},{"n":9,"code":"T9.07","link":"REL.024 · MEC.017","q":["Do you choose how customers obtain your product and check where they encounter obstacles?","Вы выбираете способы получения продукта покупателями и проверяете, где возникают препятствия?"],"action":["Trace the purchase and delivery process to identify barriers.","Проследите путь получения предложения и барьеры для клиента."]},{"n":10,"code":"T10.02","link":"REL.027–028 · MEC.018","q":["Do you select an audience, message and channel, and use audience response to improve communications?","Вы определяете аудиторию, сообщение и способ коммуникации, а затем учитываете реакцию?"],"action":["Connect the message to its audience and check the response.","Свяжите сообщение с аудиторией и проверьте её реакцию."] function radarSvg(){
 const cx=151,cy=148,r=106,step=Math.PI*2/13;
 const polar=(i,v)=>{const a=-Math.PI/2+i*step;return [cx+r*v*Math.cos(a),cy+r*v*Math.sin(a)]};
 const poly=vs=>vs.map((v,i)=>polar(i,v).map(x=>x.toFixed(1)).join(",")).join(" ");
 const actual=areas.map((_,i)=>({yes:.83,partial:.52,no:.18})[answers[i+1]]??null);
 const target=mode==="general"?generalTargetLevels.map(v=>v/10):areas.map((_,i)=>{const p=requirementProfiles[typeof scenario==="number"?scenario:1],n=i+1;return p.primary.includes(n)?.8:p.supporting.includes(n)?.7:p.context.includes(n)?.5:null});
 const plottedTarget=target.map(x=>x===null?.15:x),plottedActual=actual.map(x=>x===null?.5:x);
 let h='<svg class="radar" viewBox="0 0 305 310" role="img" aria-label="Target reference and actual self-report, 13 domains">';
 for(const k of [.25,.5,.75,1])h+='<polygon points="'+poly(Array(13).fill(k))+'" fill="none" stroke="#dce8df"/>';
 for(let i=0;i<13;i++){const p=polar(i,1);h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#dce8df"/>'}
 h+='<polygon points="'+poly(plottedTarget)+'" stroke="#12816c" stroke-width="2.5" stroke-dasharray="5 3" fill="#12816c" fill-opacity=".07"/>';
 h+='<polygon points="'+poly(plottedActual)+'" stroke="#d98a42" stroke-width="2.5" fill="#d98a42" fill-opacity=".07"/>';
 for(let i=0;i<13;i++){
  const n=i+1,pos=polar(i,plottedActual[i]),lab=polar(i,1.2);
  h+='<text x="'+lab[0]+'" y="'+(lab[1]+4)+'" font-size="10" text-anchor="middle" fill="currentColor">T'+n+'</text>';
  if(target[i]!==null){const g=polar(i,target[i]);h+='<circle cx="'+g[0]+'" cy="'+g[1]+'" r="3.5" fill="#12816c"/>'}
  const gap=(target[i]===null||actual[i]===null)?null:target[i]-actual[i];
  const priorityColor=actual[i]===null?"#85948c":gap!==null&&gap>=.35?"#b9433c":gap!==null&&gap>=.12?"#d99b3f":"#d98a42";
  h+='<circle cx="'+pos[0]+'" cy="'+pos[1]+'" r="'+(gap!==null&&gap>=.35?6:4.5)+'" fill="'+(actual[i]===null?"white":priorityColor)+'" stroke="'+priorityColor+'" stroke-width="'+(gap!==null&&gap>=.35?2.5:1.5)+'"/>';
 }
 return h+"</svg>";
}

function gapInfo(n){
 const target=generalTargetLevels[n-1]/10,actual=({yes:.83,partial:.52,no:.18})[answers[n]]??null;
 const gap=actual===null?null:target-actual;
 return {n,target,actual,gap,status:gap===null?"unknown":gap>=.35?"critical":gap>=.12?"moderate":"meets"};
}
function sortedGaps(){const weight={critical:0,moderate:1,unknown:2,meets:3};return general.map(q=>({...q,...gapInfo(q.n)})).sort((a,b)=>weight[a.status]-weight[b.status]||(b.gap??-1)-(a.gap??-1))}

function renderMaster(){const t=L(),f=lang==="en"?0:1,gaps=priorityList();const priorities=gaps.filter(q=>answers[q.n]!=="unknown").slice(0,3);const list=priorities.length?priorities.map(q=>'T'+q.n+' · '+name(q.n)).join(" · "):(lang==="en"?"No missing/partial practice reported":"Отсутствующие или частичные практики не заявлены");

'<div class="masterVisual"><p class="label">'+escape(lang==="en"?"ORIGINAL MASTER MODEL · VISUAL EXAMPLE":"ИСХОДНАЯ СХЕМА MASTER · НАГЛЯДНЫЙ ПРИМЕР")+'</p>'+
'<p class="explain">'+escape(lang==="en"?"Research inputs feed professional operations. G1, G2 and G3 check prerequisites; when evidence is insufficient, the method returns to an affected step. This illustrates the method—not an automated decision engine.":"Исследовательские данные поступают в профессиональные операции. Точки G1, G2 и G3 проверяют основания; при их недостатке метод предусматривает возврат к нужному шагу. Это демонстрация методологии, а не автоматический движок.")+'</p>'+
(lang==="en"?masterDiagramEN:masterDiagramRU)+
'<div class="controls"><a class="secondary" href="https://marketing-studio-master-demo.onrender.com/#model" target="_blank" rel="noopener noreferrer">'+escape(lang==="en"?"Open the complete original MASTER demonstration ↗":"Открыть полную исходную демонстрацию MASTER ↗")+'</a></div></div>'+
'<div class="chain">'+
'<div class="chainItem"><span class="num">01 · '+escape(t.working)+'</span><h3>'+escape(t.master1)+'</h3><p>'+escape(t.master1Desc)+'</p><p><strong>'+escape(mode==="general"?t.generalProblem:activeTask().title[f])+'</strong><br>'+escape(list)+'</p></div><div class="down">↓</div>'+
'<div class="chainItem"><span class="num">02 · '+escape(t.working)+'</span><h3>'+escape(t.master2)+'</h3><p>'+escape(t.master2Desc)+'</p>'+(priorities.length?'<p>'+priorities.map(q=>escape(q.action[f])).join(' ')+'</p>':'')+'</div><div class="down">↓</div>'+
'<div class="chainItem"><span class="num">03 · '+escape(t.method)+'</span><h3>'+escape(t.master3)+'</h3><p>'+escape(t.master3Desc)+'</p></div><div class="down">↓</div>'+
'<div class="chainItem"><span class="num">04 · '+escape(t.planned)+'</span><h3>'+escape(t.master4)+'</h3><p>'+escape(t.master4Desc)+'</p></div></div>'+
'<div class="callout"><strong>'+escape(t.end)+'</strong></div><div class="controls"><button class="secondary" onclick="go(2)">← '+escape(t.return)+'</button><button class="secondary" onclick="resetAll()">'+escape(t.restart)+'</button></div>';
}

const workflowCases=[
{map:[3,4,6,9,10,13],phases:[["Check market and buyer segments","Проверить рынок и сегменты"],["Check value proposition and access","Проверить ценность и доступность"],["Review evidence for acquisition actions","Проверить основания действий по привлечению"]]},
{map:[3,5,2,6,8,9],phases:[["Understand buyer choice criteria","Выяснить критерии выбора"],["Compare alternatives, offer and price","Сопоставить альтернативы, предложение и цену"],["Check evidence before changing the offer","Проверить основания изменения предложения"]]},
{map:[8,6,13,12,4],phases:[["Clarify margin and price drivers","Определить факторы цены и маржи"],["Test value, segments and alternative choices","Проверить ценность, сегменты и альтернативы"],["Validate the proposed changes with cost data","Проверить решение с учётом затрат"]]},
{map:[4,5,2,1,6,9],phases:[["Investigate demand and market conditions","Исследовать спрос и условия рынка"],["Check segment, competitors and offer fit","Проверить сегмент, конкурентов и предложение"],["Check constraints and market-entry evidence","Проверить ограничения и основания выхода"]]},
{map:[11,6,13,12,7],phases:[["Review customer journey and retention signals","Изучить путь и удержание клиентов"],["Check value, experience and brand perceptions","Проверить ценность, опыт и восприятие"],["Validate a retention intervention","Проверить предполагаемые меры удержания"]]}
];
function workflow(){return workflowCases[typeof scenario==="number"?scenario:1]}
function setGate(n,v){gateAnswers[n]=v;lastReturn=v==="missing"?n:null;render()}
function gateAction(n){if(lastReturn===n){go(2);return}lastReturn=n;go(2)}
function renderProblemFlow(){
 const isEn=lang==="en",f=isEn?0:1,w=workflow(),t=activeTask();
 $("stage").innerHTML='<div class="label">'+escape(isEn?"MASTER · PROFESSIONAL WORKFLOW":"MASTER · ПРОФЕССИОНАЛЬНЫЙ МАРШРУТ")+'</div>'+
 '<h2>'+escape(t.title[f])+'</h2><p class="explain">'+escape(isEn?"This is a pre-defined illustrative route for your chosen question. The professional method structures research, decisions and evidence checks, not a self-assessment score.":"Это заранее описанный пример маршрута по выбранной задаче. Метод организует исследования, решения и проверку доказательств, а не самооценку.")+'</p>'+
 (lastReturn!==null?'<div class="gateStatus return">'+escape(isEn?"Returned from checkpoint G"+lastReturn+": examine its missing inputs before continuing.":"Возврат из точки G"+lastReturn+": нужно уточнить недостающие исходные данные перед продолжением.")+'</div>':'')+
 '<div class="masterVisual"><p class="label">'+escape(isEn?"MASTER · DEPENDENCIES AND RETURNS":"MASTER · ЗАВИСИМОСТИ И ВОЗВРАТЫ")+'</p>'+
 (isEn?masterDiagramEN:masterDiagramRU)+'</div>'+
 '<h3>'+escape(isEn?"Illustrative steps for the selected question":"Пример операций по выбранной задаче")+'</h3>'+
 '<div class="taskSteps">'+w.phases.map((p,i)=>'<div class="taskStep"><b>G'+(i+1)+' · '+escape(p[f])+'</b><p>'+escape(isEn?"Check necessary inputs; if insufficient, return to earlier work.":"Проверить исходные сведения; при недостатке вернуться к нужной работе.")+'</p></div>').join("")+'</div>'+
 '<p class="caption">'+escape(isEn?"Relevant Marketing Map areas: ":"Связанные области Marketing Map: ")+w.map.map(n=>"T"+n+" "+name(n)).join(" · ")+'</p>'+
 '<div class="callout">'+escape(isEn?"The original MASTER graph above is an example of professional dependencies. It does not mean the system has run these operations or collected evidence for this company.":"Исходный граф MASTER — пример профессиональных зависимостей. Программа пока не выполнила эти операции и не собрала доказательства по компании.")+'</div>'+
 '<div class="controls"><button class="primary" onclick="go(3)">'+escape(isEn?"Explore G1–G3 checks and returns →":"Проверить точки G1–G3 и возвраты →")+'</button><button class="secondary" onclick="go(1)">'+escape(isEn?"← Choose a different problem":"← Другая задача")+'</button></div>';
}
function renderProblemGates(){
 const isEn=lang==="en",f=isEn?0:1,w=workflow(),opts=[["enough",isEn?"Evidence sufficient":"Доказательств достаточно"],["missing",isEn?"Missing evidence — return":"Данных недостаточно — возврат"],["unknown",isEn?"Not checked yet":"Ещё не проверено"]];
 $("stage").innerHTML='<div class="label">'+escape(isEn?"MASTER · DECISION GATES":"MASTER · КОНТРОЛЬНЫЕ ТОЧКИ")+'</div>'+
 '<h2>'+escape(isEn?"What happens when evidence is insufficient?":"Что происходит при недостатке доказательств?")+'</h2>'+
 '<p class="explain">'+escape(isEn?"An interactive demonstration of MASTER decision-gate rules. Your selections simulate evidence status; no research is performed in this prototype.":"Интерактивная иллюстрация правил контрольных точек MASTER. Вы выбираете условный статус доказательств; реальное исследование здесь не выполняется.")+'</p>'+
 w.phases.map((p,i)=>{
  const n=i+1,value=gateAnswers[n]||"unknown";
  const message=value==="enough"?(isEn?"Example gate passed; the method allows the next step.":"Условная проверка пройдена — метод допускает следующий шаг."):value==="missing"?(isEn?"STOP: evidence is insufficient. Return to the relevant research or earlier operation.":"СТОП: доказательств недостаточно. Вернуться к нужному исследованию или предыдущей операции."):(isEn?"No evidence decision yet. Select a hypothetical status below.":"Решение о достаточности не принято. Выберите условный статус.");
  return '<div class="gatePanel"><h3>G'+n+' · '+escape(p[f])+'</h3><p>'+escape(isEn?"What evidence would justify moving ahead? If not sufficient, MASTER prescribes a return to the affected step.":"Какие доказательства позволяют двигаться дальше? При недостатке MASTER предусматривает возврат к затронутой операции.")+'</p>'+
  '<div class="answers">'+opts.map(z=>'<button class="ans '+(value===z[0]?"active":"")+'" onclick="setGate('+n+',\''+z[0]+'\')" aria-pressed="'+(value===z[0])+'">'+escape(z[1])+'</button>').join("")+'</div>'+
  '<div class="gateStatus '+(value==="missing"?"return":value==="enough"?"ok":"")+'">'+escape(message)+'</div>'+
  (value==="missing"?'<button class="secondary" style="margin-top:10px" onclick="gateAction('+n+')">'+escape(isEn?"↶ Return to workflow and affected inputs":"↶ Вернуться к схеме и исходным данным")+'</button>':"")+'</div>';
 }).join("")+
 '<div class="callout">'+escape(isEn?"These interactions demonstrate how a formal gate may stop progression and require a return. Automated source validation, dependency tracking and actual execution are future development.":"Это иллюстрация принципа: контрольная точка может остановить переход и потребовать возврата. Автоматическая проверка источников, отслеживание зависимостей и исполнение операций — следующий этап разработки.")+'</div>'+
 '<div class="controls"><button class="primary" onclick="go(2)">'+escape(isEn?"← Return to MASTER diagram":"← Вернуться к схеме MASTER")+'</button><button class="secondary" onclick="go(1)">'+escape(isEn?"Choose another problem":"Другая задача")+'</button></div>';
}

function render(){
 initShell();
 if(screen===0)renderStart();
 else if(mode==="general"){
  if(screen===1)renderQuestions();
  if(screen===2)renderResults();
  if(screen===3)renderGeneralActions();
 }else{
  if(screen===1)renderQuestions();
  if(screen===2)renderProblemFlow();
  if(screen===3)renderProblemGates();
 }
}
mode="general";screen=1;render();
</script>
