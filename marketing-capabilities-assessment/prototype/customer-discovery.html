<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Тест маркетинговых способностей — пилот</title><style>body{font:16px/1.55 system-ui,sans-serif;background:#f6f7f9;color:#172334;margin:0}.wrap{max-width:720px;margin:32px auto;padding:0 18px}.panel{background:white;border:1px solid #dce2ea;border-radius:16px;padding:26px;margin:16px 0}h1{font-size:28px}h2{font-size:21px}.muted{color:#526276}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid #bdc8d4;padding:14px;border-radius:9px;margin:10px 0;font:inherit;cursor:pointer}.choice:hover{background:#eff6ff}.small{font-size:13px}button.secondary{padding:10px 16px;border-radius:8px;border:1px solid #bdc8d4;background:#fff;cursor:pointer}.tag{font-size:12px;color:#425f85;background:#eaf1fb;padding:4px 8px;border-radius:20px}</style></head><body><main class="wrap"><h1>Тест маркетинговых способностей</h1><p class="muted">Исследовательский прототип: один сценарий «Понимание покупателя». Не является валидированным тестом или оценкой компании.</p><section class="panel" id="screen"></section><p class="small muted">Ответы обрабатываются локально в браузере и никуда не отправляются.</p></main><script>
const steps={
start:{title:'О какой покупке идёт речь?',body:'Для проверки выберите типичную ситуацию.',options:[['b2b','Покупка организацией (B2B)'],['b2c','Покупка частным лицом (B2C)'],['unknown','Пока не определено']]},
roles:{title:'Кто участвует в решении о покупке?',body:'Оцениваем, насколько вы понимаете участников выбора.',options:[['evidenced','Роли известны и подтверждены интервью, сделками или наблюдениями'],['assumed','Роли описаны, но основаны преимущественно на предположениях'],['none','Роли не определены'],['unknown','Не знаю']]},
criteria:{title:'Известно ли, по каким критериям выбирают?',body:'Важно не наличие красивого списка, а происхождение знания.',options:[['evidenced','Критерии подтверждены исследованиями или реальными покупками'],['assumed','Есть гипотезы, но они не проверены'],['none','Критерии не определены'],['unknown','Не знаю']]},
context:{title:'Для какого сегмента и периода это установлено?',body:'Отношения RC3 применимы только при явном контексте.',options:[['specific','Указаны конкретный сегмент и актуальный период'],['vague','Описано обобщённо, без периода или сегмента'],['unknown','Не знаю']]}
};
const answers={},order=['start','roles','criteria','context'];let current='start';const root=document.getElementById('screen');function draw(){if(current==='result')return result();const s=steps[current];root.innerHTML='<span class="tag">Пилот · '+(order.indexOf(current)+1)+' / 4</span><h2>'+s.title+'</h2><p>'+s.body+'</p>';for(const [key,label] of s.options){let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{answers[current]=key;let idx=order.indexOf(current);current=idx===order.length-1?'result':order[idx+1];draw()};root.append(b)}}function result(){const findings=[];if(answers.start==='unknown')findings.push('Контекст покупки не определён: выводы о ролях ограничены.');else findings.push('Тип покупки: '+(answers.start==='b2b'?'организационная':'потребительская')+'.');for(const [field,label] of [['roles','Участники покупки'],['criteria','Критерии выбора']]){const val=answers[field];findings.push(label+': '+({evidenced:'есть подтверждённое по самоотчёту описание; документы не проверены',assumed:'пока гипотеза, нужна проверка',none:'не определены',unknown:'нет данных'}[val]||'нет данных'))}if(answers.context!=='specific')findings.push('Нет подтверждённого сегментно-временного контекста — нельзя считать утверждения применимыми ко всему рынку.');const next=answers.roles!=='evidenced'?'Проверить роли в нескольких реальных сделках или интервью.':answers.criteria!=='evidenced'?'Сопоставить критерии выбора с интервью и выигранными/проигранными сделками.':answers.context!=='specific'?'Уточнить сегмент и период применимости.':'Проверить документы и перейти к следующей области диагностики.';root.innerHTML='<span class="tag">Качественный результат · без баллов</span><h2>Что можно заключить</h2><ul>'+findings.map(x=>'<li>'+x+'</li>').join('')+'</ul><h2>Следующая проверка</h2><p>'+next+'</p><p class="small muted">Онтология: T2.06–T2.09, T3.08, T3.09; связи REL.005 и REL.006. Это маршруты проверки, а не доказательства или автоматические оценки.</p>';const b=document.createElement('button');b.className='secondary';b.textContent='Начать заново';b.onclick=()=>{for(const k in answers)delete answers[k];current='start';draw()};root.append(b)}draw();
</script></body></html>
