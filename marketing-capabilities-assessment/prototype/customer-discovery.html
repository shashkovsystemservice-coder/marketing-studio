<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Тест маркетинговых способностей — пилот</title><style>body{font:16px/1.55 system-ui,sans-serif;background:#f6f7f9;color:#172334;margin:0}.wrap{max-width:720px;margin:32px auto;padding:0 18px}.panel{background:white;border:1px solid #dce2ea;border-radius:16px;padding:26px;margin:16px 0}h1{font-size:28px}h2{font-size:21px}.muted{color:#526276}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid #bdc8d4;padding:14px;border-radius:9px;margin:10px 0;font:inherit;cursor:pointer}.choice:hover{background:#eff6ff}.small{font-size:13px}button.secondary{padding:10px 16px;border-radius:8px;border:1px solid #bdc8d4;background:#fff;cursor:pointer}.tag{font-size:12px;color:#425f85;background:#eaf1fb;padding:4px 8px;border-radius:20px}</style></head><body><main class="wrap"><h1>Тест маркетинговых способностей</h1><p class="muted">Исследовательский прототип: один сценарий «Понимание покупателя». Не является валидированным тестом или оценкой компании.</p><section class="panel" id="screen"></section><p class="small muted">Ответы обрабатываются локально в браузере и никуда не отправляются.</p></main><script>
const steps={
scope:{title:'Что именно покупают?',body:'Пока объект покупки неизвестен, оценка ролей и критериев была бы произвольной.',options:[['unknown','Не могу определить сейчас'],['research','Нужно исследовать, кто покупает и что именно']]},
start:{title:'О какой покупке идёт речь?',body:'Для проверки выберите типичную ситуацию.',options:[['b2b','Покупка организацией (B2B)'],['b2c','Покупка частным лицом (B2C)'],['unknown','Пока не определено']]},
roles:{title:'Кто участвует в решении о покупке?',body:'Оцениваем, насколько вы понимаете участников выбора.',options:[['evidenced','Роли известны и подтверждены интервью, сделками или наблюдениями'],['assumed','Роли описаны, но основаны преимущественно на предположениях'],['none','Роли не определены'],['unknown','Не знаю']]},
criteria:{title:'Известно ли, по каким критериям выбирают?',body:'Важно не наличие красивого списка, а происхождение знания.',options:[['evidenced','Критерии подтверждены исследованиями или реальными покупками'],['assumed','Есть гипотезы, но они не проверены'],['none','Критерии не определены'],['unknown','Не знаю']]},
context:{title:'Для какого сегмента и периода это установлено?',body:'Отношения RC3 применимы только при явном контексте.',options:[['specific','Указаны конкретный сегмент и актуальный период'],['vague','Описано обобщённо, без периода или сегмента'],['unknown','Не знаю']]}
};
const answers={},history=[];let current='start';const root=document.getElementById('screen');
function nextStep(step,value){
 if(step==='start')return value==='unknown'?'scope':'roles';
 if(step==='scope')return 'result';
 if(step==='roles')return value==='none'||value==='unknown'?'result':'criteria';
 if(step==='criteria')return value==='none'||value==='unknown'?'result':'context';
 if(step==='context')return 'result';
 return 'result';
}
function draw(){if(current==='result')return result();const s=steps[current];root.innerHTML='<span class="tag">Пилот · адаптивный сценарий · '+(history.length+1)+' вопрос</span><h2>'+s.title+'</h2><p>'+s.body+'</p>';for(const [key,label] of s.options){let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{answers[current]=key;history.push({question:current,answer:key});current=nextStep(current,key);draw()};root.append(b)}}
function result(){const findings=[];const start=answers.start;if(start==='unknown')findings.push('Тип покупки не определён. Дальнейшие вопросы о ролях и критериях пропущены: сначала нужно установить объект анализа.');else findings.push('Тип покупки: '+(start==='b2b'?'организационная':'потребительская')+'.');if(answers.roles){const val=answers.roles;findings.push('Участники покупки: '+({evidenced:'описаны и подтверждены по самоотчёту; доказательства ещё не проверены',assumed:'описаны как гипотеза',none:'не определены',unknown:'нет данных'}[val]));}if(answers.criteria){findings.push('Критерии выбора: '+({evidenced:'заявлено подтверждение; документы ещё не проверены',assumed:'пока гипотеза',none:'не определены',unknown:'нет данных'}[answers.criteria]));}if(answers.context){findings.push(answers.context==='specific'?'Указан сегмент и период (по самоотчёту).':'Контекст сегмента и периода не установлен.');}let next=start==='unknown'?'Определить, кто покупает и какую покупку анализируем.':answers.roles!=='evidenced'?'Установить роли участников на примере реальных покупок.':answers.criteria!=='evidenced'?'Проверить критерии выбора на интервью или сделках.':answers.context!=='specific'?'Уточнить сегмент и временной период.':'Проверить заявленные доказательства, затем перейти к следующей области.';const skipped=steps?['scope','roles','criteria','context'].filter(k=>!history.some(h=>h.question===k)&&k!=='scope'):[];root.innerHTML='<span class="tag">Качественный результат · без баллов</span><h2>Что установлено</h2><ul>'+findings.map(x=>'<li>'+x+'</li>').join('')+'</ul><h2>Следующая проверка</h2><p>'+next+'</p><p class="small muted">Задано вопросов: '+history.length+'. Пропущенные вопросы: '+(skipped.length?skipped.join(', '):'нет')+'. Пропуск означает недостаток оснований для следующего вопроса, а не положительную оценку.</p><p class="small muted">RC3: T2.06–T2.09, T3.08, T3.09; REL.005, REL.006. Связи используются как навигация, а не как доказательства.</p>';const b=document.createElement('button');b.className='secondary';b.textContent='Начать заново';b.onclick=()=>{for(const k in answers)delete answers[k];history.length=0;current='start';draw()};root.append(b)}draw();
</script></body></html>
